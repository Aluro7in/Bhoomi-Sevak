<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f5"/>
      <stop offset="40%" stop-color="#f6f2e9"/>
      <stop offset="100%" stop-color="#ecdfd0"/>
    </linearGradient>

    <!-- Vintage Paper Gradient -->
    <linearGradient id="paper5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="fadeLeft5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbf9f5" stop-opacity="0.97"/>
      <stop offset="40%" stop-color="#fbf9f5" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#fbf9f5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbf9f5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="680" fill="url(#bg5)"/>

  <!-- Document & Smartphone Cross-Verification Scene (X: 450 - 1600) -->
  <g transform="translate(480, 0)">
    <!-- Silk Fabric Border at Top Right -->
    <g transform="translate(920, 0)">
      <polygon points="0,0 200,0 200,300 50,150" fill="#4c0519" opacity="0.85"/>
      <polygon points="0,0 200,0 200,80 20,40" fill="#d97706" opacity="0.9"/>
      <line x1="20" y1="20" x2="200" y2="180" stroke="#fde047" stroke-width="2" stroke-dasharray="6 3"/>
    </g>

    <!-- 1. VINTAGE PAPER KHATAUNI DOCUMENT (Left-of-Phone) -->
    <g transform="translate(140, 60) rotate(-4)">
      <!-- Drop Shadow -->
      <rect x="0" y="0" width="380" height="520" rx="8" fill="#000" opacity="0.2" transform="translate(10, 15)"/>
      <!-- Main Paper Body -->
      <rect x="0" y="0" width="380" height="520" rx="8" fill="url(#paper5)" stroke="#b45309" stroke-width="2"/>

      <!-- Document Header Bar -->
      <rect x="25" y="35" width="330" height="20" rx="3" fill="#c4b5fd" opacity="0.8"/>
      <rect x="25" y="65" width="330" height="14" rx="2" fill="#e0e7ff" opacity="0.6"/>

      <!-- Table Rows -->
      <g opacity="0.6" stroke="#92400e" stroke-width="1">
        <line x1="25" y1="95" x2="355" y2="95"/>
        <line x1="25" y1="125" x2="355" y2="125"/>
        <line x1="25" y1="155" x2="355" y2="155"/>
        <line x1="25" y1="185" x2="355" y2="185"/>
        <line x1="25" y1="215" x2="355" y2="215"/>

        <!-- Columns -->
        <line x1="75" y1="65" x2="75" y2="215"/>
        <line x1="165" y1="65" x2="165" y2="215"/>
        <line x1="265" y1="65" x2="265" y2="215"/>
      </g>

      <!-- Document Map Sketch in Lower Half -->
      <g transform="translate(30, 240)">
        <rect x="0" y="0" width="320" height="180" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <polygon points="20,20 130,25 100,85 30,75" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
        <polygon points="130,25 240,15 210,85 100,85" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
        <polygon points="30,75 100,85 110,160 20,150" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
        <polygon points="100,85 210,85 280,140 190,165 110,160" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
        <text x="160" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">452</text>
      </g>

      <!-- Official Red Seal -->
      <circle cx="290" cy="465" r="22" fill="none" stroke="#dc2626" stroke-width="2"/>
      <circle cx="290" cy="465" r="16" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 1.5"/>
      <text x="290" y="470" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">OFFICIAL</text>
    </g>

    <!-- 2. SMARTPHONE DEVICE (Right of Document, Showing Bhoomi Sevak Discrepancy & Verification) -->
    <g transform="translate(680, 80) rotate(5)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="240" height="490" rx="36" fill="#0f172a" stroke="#334155" stroke-width="6" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.4))"/>
      <!-- Screen Glass -->
      <rect x="10" y="14" width="220" height="462" rx="28" fill="#ffffff"/>

      <!-- App Header: Document Intelligence -->
      <rect x="10" y="14" width="220" height="55" rx="4" fill="#7c3aed"/>
      <rect x="25" y="32" width="70" height="8" rx="2" fill="#ffffff"/>
      <rect x="125" y="32" width="85" height="8" rx="2" fill="#ffffff" opacity="0.8"/>

      <!-- Two-Column Verification Layout on Screen -->
      <!-- Left Column: Extracted Paper Data -->
      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="60" height="6" rx="2" fill="#334155"/>
        <rect x="8" y="18" width="40" height="5" rx="2" fill="#64748b"/>
      </g>
      <g transform="translate(20, 120)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="50" height="6" rx="2" fill="#334155"/>
        <rect x="8" y="18" width="65" height="5" rx="2" fill="#64748b"/>
      </g>
      <g transform="translate(20, 160)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="70" height="6" rx="2" fill="#334155"/>
        <rect x="8" y="18" width="35" height="5" rx="2" fill="#64748b"/>
      </g>

      <!-- Right Column: Official Registry Comparison -->
      <g transform="translate(125, 80)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="60" height="6" rx="2" fill="#16a34a"/>
        <rect x="8" y="18" width="40" height="5" rx="2" fill="#64748b"/>
      </g>
      <g transform="translate(125, 120)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="50" height="6" rx="2" fill="#16a34a"/>
        <rect x="8" y="18" width="65" height="5" rx="2" fill="#64748b"/>
      </g>
      <g transform="translate(125, 160)">
        <rect x="0" y="0" width="95" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="8" y="8" width="70" height="6" rx="2" fill="#16a34a"/>
        <rect x="8" y="18" width="35" height="5" rx="2" fill="#64748b"/>
      </g>

      <!-- Central Comparison Timeline Track -->
      <line x1="120" y1="80" x2="120" y2="400" stroke="#c4b5fd" stroke-width="2"/>
      <circle cx="120" cy="95" r="4" fill="#7c3aed"/>
      <circle cx="120" cy="135" r="4" fill="#7c3aed"/>
      <circle cx="120" cy="175" r="4" fill="#7c3aed"/>
      <circle cx="120" cy="225" r="6" fill="#f59e0b"/>
      <circle cx="120" cy="285" r="4" fill="#7c3aed"/>
      <circle cx="120" cy="340" r="4" fill="#7c3aed"/>

      <!-- Prominent Verification Alert Banner (Amber Encumbrance Flag) -->
      <g transform="translate(20, 210)">
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="18" cy="21" r="10" fill="#f59e0b"/>
        <text x="18" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
        <text x="36" y="18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#92400e">Bank Charge Detected</text>
        <text x="36" y="30" font-family="sans-serif" font-size="8" fill="#b45309">KCC Mortgage • SBI Bilari</text>
      </g>

      <!-- Additional Verified Fields -->
      <g transform="translate(20, 270)">
        <rect x="0" y="0" width="200" height="34" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="16" font-family="sans-serif" font-size="8" font-weight="bold" fill="#166534">Gata 452 • Area 0.8120 Ha</text>
        <text x="12" y="27" font-family="sans-serif" font-size="7" fill="#15803d">100% Registry Match</text>
      </g>
      <g transform="translate(20, 315)">
        <rect x="0" y="0" width="200" height="34" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="12" y="16" font-family="sans-serif" font-size="8" font-weight="bold" fill="#166534">Owner: Ram Kumar Singh</text>
        <text x="12" y="27" font-family="sans-serif" font-size="7" fill="#15803d">Identity Confirmed</text>
      </g>
    </g>

    <!-- 3. PURPLE DASHED INDICATOR LINES (Bridging Paper Document to Smartphone Screen) -->
    <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" opacity="0.85">
      <!-- Line 1: From Table Row 1 to Phone Item 1 -->
      <line x1="390" y1="170" x2="685" y2="180"/>
      <circle cx="390" cy="170" r="4" fill="#7c3aed"/>

      <!-- Line 2: From Table Row 2 to Phone Item 2 -->
      <line x1="395" y1="210" x2="685" y2="220"/>
      <circle cx="395" cy="210" r="4" fill="#7c3aed"/>

      <!-- Line 3: From Paper Cadastral Map to Phone Alert -->
      <line x1="430" y1="310" x2="690" y2="300"/>
      <circle cx="430" cy="310" r="5" fill="#f59e0b"/>

      <!-- Line 4: From Paper Gata 452 to Phone Card -->
      <line x1="440" y1="380" x2="695" y2="365"/>
      <circle cx="440" cy="380" r="4" fill="#7c3aed"/>

      <!-- Line 5: From Bottom Column to Phone Lower Section -->
      <line x1="460" y1="440" x2="705" y2="425"/>
      <circle cx="460" cy="440" r="4" fill="#7c3aed"/>
    </g>
  </g>

  <!-- Left-to-Right Subtle Wash Overlay -->
  <rect x="0" y="0" width="850" height="680" fill="url(#fadeLeft5)"/>

  <!-- Topographic Contour Lines on Left Overlay -->
  <path d="M 0,85 Q 240,115 390,65 T 710,95" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,215 Q 260,245 420,185 T 760,225" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,345 Q 220,375 450,305 T 805,355" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,475 Q 290,505 500,445 T 855,485" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
</svg>
