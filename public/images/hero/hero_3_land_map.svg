<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#eae0cf"/>
    </linearGradient>

    <linearGradient id="fadeLeft3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.97"/>
      <stop offset="40%" stop-color="#fdfbf7" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#fdfbf7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fdfbf7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="680" fill="url(#bg3)"/>

  <!-- Aerial Farm Cadastral Landscape on the Right Half (X: 450 - 1600) -->
  <g transform="translate(420, 0)">
    <!-- Base Landscape / Field Plots Matrix -->
    <rect x="150" y="0" width="1100" height="680" fill="#d4cca8"/>

    <!-- Patchwork Mosaic of Agricultural Fields (Ochres, Greens, Tans) -->
    <!-- Top Far Fields -->
    <polygon points="150,0 450,0 420,120 150,140" fill="#a3b18a"/>
    <polygon points="450,0 750,0 720,110 420,120" fill="#e9d8a6"/>
    <polygon points="750,0 1100,0 1100,100 720,110" fill="#a7c957"/>

    <!-- Mid Tier Farmland Plots -->
    <polygon points="150,140 420,120 380,240 150,260" fill="#606c38"/>
    <polygon points="420,120 720,110 680,230 380,240" fill="#dda15e"/>
    <polygon points="720,110 950,100 920,210 680,230" fill="#bc6c25"/>
    <polygon points="950,100 1100,100 1100,220 920,210" fill="#84a98c"/>

    <!-- Lower Mid Plots -->
    <polygon points="150,260 380,240 330,420 150,450" fill="#283618"/>
    <polygon points="380,240 680,230 620,410 330,420" fill="#d4a373"/>
    <polygon points="680,230 920,210 880,390 620,410" fill="#a3b18a"/>

    <!-- Bottom Tier Plots -->
    <polygon points="150,450 330,420 280,680 150,680" fill="#588157"/>
    <polygon points="330,420 620,410 550,680 280,680" fill="#ccd5ae"/>
    <polygon points="620,410 880,390 820,680 550,680" fill="#3a5a40"/>
    <polygon points="880,390 1100,370 1100,680 820,680" fill="#a98467"/>

    <!-- Winding Rural Road / Chak Road -->
    <path d="M 600,0 C 650,120 750,200 850,270 C 950,340 1000,480 1050,680" fill="none" stroke="#f1efe7" stroke-width="24" stroke-linecap="round"/>
    <path d="M 600,0 C 650,120 750,200 850,270 C 950,340 1000,480 1050,680" fill="none" stroke="#e6dec8" stroke-width="18" stroke-linecap="round"/>

    <!-- Secondary Chak Road branching off -->
    <path d="M 850,270 L 620,410 L 400,480" fill="none" stroke="#f1efe7" stroke-width="14" stroke-linecap="round"/>
    <path d="M 850,270 L 620,410 L 400,480" fill="none" stroke="#e6dec8" stroke-width="10" stroke-linecap="round"/>

    <!-- Rural Village Settlement Cluster (Houses with terracotta roofs) -->
    <g transform="translate(850, 140)">
      <!-- House clusters -->
      <rect x="20" y="20" width="30" height="24" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
      <polygon points="15,20 35,5 55,20" fill="#ea580c"/>
      <rect x="60" y="15" width="34" height="26" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
      <polygon points="55,15 77,2 99,15" fill="#c2410c"/>
      <rect x="35" y="55" width="28" height="22" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
      <polygon points="30,55 49,42 68,55" fill="#ea580c"/>
      <rect x="75" y="50" width="36" height="28" rx="2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
      <polygon points="70,50 93,35 116,50" fill="#9a3412"/>
      <!-- Village Trees (Round Green Banyan/Neem Canopies) -->
      <circle cx="15" cy="50" r="18" fill="#2d6a4f" opacity="0.9"/>
      <circle cx="55" cy="10" r="14" fill="#40916c" opacity="0.9"/>
      <circle cx="115" cy="40" r="22" fill="#1b4332" opacity="0.9"/>
      <circle cx="85" cy="90" r="16" fill="#2d6a4f" opacity="0.9"/>
    </g>

    <!-- HIGHLIGHTED AGRICULTURAL PLOT / GATA (Purple Boundary & Shading) -->
    <g transform="translate(480, 240)">
      <!-- Plot Boundary Polygon -->
      <polygon points="80,10 240,40 200,230 30,190" fill="#a855f7" fill-opacity="0.55" stroke="#7c3aed" stroke-width="5" filter="drop-shadow(0 6px 12px rgba(124,58,237,0.35))"/>
      
      <!-- Inner Boundary Glow Line -->
      <polygon points="85,18 232,46 195,222 38,185" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-dasharray="6 3"/>

      <!-- Center Location Pin Marker (High Contrast Purple & White) -->
      <g transform="translate(135, 100)">
        <!-- Pin Shadow -->
        <ellipse cx="0" cy="45" rx="16" ry="7" fill="#4c1d95" opacity="0.4"/>
        <!-- Teardrop Pin Shape -->
        <path d="M 0,40 C -22,15 -22,-18 0,-18 C 22,-18 22,15 0,40 Z" fill="#6d28d9" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
        <!-- White Inner Dot -->
        <circle cx="0" cy="-2" r="8" fill="#ffffff"/>
        <circle cx="0" cy="-2" r="4" fill="#6d28d9"/>
      </g>
    </g>

    <!-- Field Boundary Trees & Hedges -->
    <g fill="#2d6a4f" opacity="0.85">
      <circle cx="380" cy="240" r="14"/>
      <circle cx="680" cy="230" r="12"/>
      <circle cx="620" cy="410" r="16"/>
      <circle cx="330" cy="420" r="11"/>
      <circle cx="480" cy="520" r="15"/>
      <circle cx="750" cy="500" r="13"/>
      <circle cx="920" cy="380" r="17"/>
    </g>
  </g>

  <!-- Left-to-Right Subtle Wash Overlay -->
  <rect x="0" y="0" width="850" height="680" fill="url(#fadeLeft3)"/>

  <!-- Topographic Contour Lines on Left Overlay -->
  <path d="M 0,80 Q 250,110 400,60 T 720,90" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,200 Q 270,230 430,170 T 770,210" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,330 Q 230,360 460,290 T 810,340" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
  <path d="M 0,460 Q 300,490 510,430 T 860,470" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
</svg>
