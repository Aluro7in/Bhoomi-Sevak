<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="sky1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Lush Field Gradient -->
    <linearGradient id="field1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="50%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>

    <linearGradient id="field2" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Farmer Skin Tone -->
    <linearGradient id="skin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c28e67"/>
      <stop offset="100%" stop-color="#935b39"/>
    </linearGradient>

    <!-- Kurta Cloth Gradient -->
    <linearGradient id="kurta1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#e2d9bc"/>
    </linearGradient>

    <!-- Lavender/Purple Gamcha -->
    <linearGradient id="gamcha1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paper1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Left Overlay Wash for Text Readability -->
    <linearGradient id="fadeLeft1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f8fafc" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="680" fill="url(#bg1)"/>

  <!-- Landscape Scene on the Right Half (X: 600 - 1600) -->
  <g transform="translate(450, 0)">
    <!-- Sky & Distant Horizon -->
    <rect x="150" y="0" width="1000" height="420" fill="url(#sky1)"/>

    <!-- Distant Village Trees & Houses -->
    <path d="M150,380 Q 250,360 400,375 T 700,365 T 1000,370 L 1000,420 L 150,420 Z" fill="#84cc16" opacity="0.6"/>
    <!-- Distant Brick Houses -->
    <rect x="720" y="340" width="50" height="35" fill="#e2e8f0" rx="2"/>
    <polygon points="715,340 745,315 775,340" fill="#cbd5e1"/>
    <rect x="785" y="335" width="60" height="40" fill="#fed7aa" rx="2"/>
    <polygon points="780,335 815,310 850,335" fill="#f97316"/>
    <rect x="860" y="345" width="45" height="30" fill="#e2e8f0"/>

    <!-- Green Crop Rows / Agricultural Fields (Foreground to Midground) -->
    <polygon points="150,400 1000,370 1000,680 150,680" fill="url(#field1)"/>
    <polygon points="150,450 600,410 800,680 150,680" fill="url(#field2)" opacity="0.75"/>
    <polygon points="500,420 1000,410 1000,680 750,680" fill="#4d7c0f"/>

    <!-- Crop Details (Lush Farm Perspective Lines) -->
    <path d="M 600,410 L 450,680 M 680,410 L 620,680 M 760,410 L 800,680 M 840,410 L 960,680" stroke="#a3e635" stroke-width="4" opacity="0.6"/>

    <!-- Farmer Figure (Center Right Focus) -->
    <g transform="translate(360, 110)">
      <!-- Body / Kurta -->
      <path d="M 120,240 Q 90,270 70,390 L 250,390 Q 230,270 200,240 Z" fill="url(#kurta1)"/>
      <path d="M 155,240 L 155,360" stroke="#d4c9a8" stroke-width="3"/>
      <!-- Kurta Buttons -->
      <circle cx="155" cy="265" r="3" fill="#a89f7f"/>
      <circle cx="155" cy="290" r="3" fill="#a89f7f"/>
      <circle cx="155" cy="315" r="3" fill="#a89f7f"/>

      <!-- Lavender Gamcha / Cloth Draped Over Neck -->
      <path d="M 115,220 C 100,260 85,350 95,440 L 125,440 C 115,350 130,260 140,225 Z" fill="url(#gamcha1)"/>
      <path d="M 195,220 C 210,260 225,350 215,440 L 185,440 C 195,350 180,260 170,225 Z" fill="url(#gamcha1)"/>
      <!-- Scarf folds -->
      <path d="M 105,280 Q 115,360 110,430" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>
      <path d="M 205,280 Q 195,360 200,430" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>

      <!-- Neck & Head -->
      <path d="M 135,220 L 175,220 L 170,170 L 140,170 Z" fill="url(#skin1)"/>
      <!-- Face -->
      <ellipse cx="155" cy="130" rx="36" ry="44" fill="url(#skin1)"/>
      <!-- Ears -->
      <ellipse cx="118" cy="135" rx="7" ry="12" fill="#935b39"/>
      <ellipse cx="192" cy="135" rx="7" ry="12" fill="#935b39"/>
      <!-- Hair -->
      <path d="M 120,120 C 120,80 190,80 190,120 C 185,95 130,95 120,120 Z" fill="#1e293b"/>
      <!-- Mustache & Facial Features -->
      <path d="M 140,145 Q 155,140 170,145 Q 155,152 140,145 Z" fill="#0f172a"/>
      <!-- Eyes & Brows -->
      <ellipse cx="142" cy="125" rx="4" ry="2" fill="#0f172a"/>
      <ellipse cx="168" cy="125" rx="4" ry="2" fill="#0f172a"/>
      <path d="M 136,118 Q 143,114 150,118" stroke="#0f172a" stroke-width="2" fill="none"/>
      <path d="M 160,118 Q 167,114 174,118" stroke="#0f172a" stroke-width="2" fill="none"/>

      <!-- Left Arm & Hand Holding Smartphone -->
      <path d="M 90,260 Q 120,310 135,325 L 155,305 Q 130,285 110,245 Z" fill="url(#kurta1)"/>
      <ellipse cx="142" cy="330" rx="14" ry="10" fill="url(#skin1)"/>
      <!-- Smartphone -->
      <rect x="135" y="280" width="30" height="58" rx="5" fill="#0f172a" stroke="#475569" stroke-width="2" transform="rotate(-15 150 310)"/>
      <rect x="138" y="284" width="24" height="48" rx="3" fill="#38bdf8" transform="rotate(-15 150 310)"/>
      <circle cx="150" cy="332" r="3" fill="#cbd5e1" transform="rotate(-15 150 310)"/>

      <!-- Right Arm & Hand Holding Khatauni Paper Sheet -->
      <path d="M 210,250 Q 250,300 290,320 L 275,345 Q 230,310 195,245 Z" fill="url(#kurta1)"/>
      <ellipse cx="285" cy="325" rx="14" ry="10" fill="url(#skin1)"/>

      <!-- Paper Land Record (Khatauni Sheet) -->
      <g transform="translate(230, 240) rotate(18)">
        <polygon points="0,0 150,-10 140,190 -10,180" fill="url(#paper1)" stroke="#d97706" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
        <!-- Document Table Lines -->
        <rect x="10" y="20" width="120" height="15" fill="#fef08a"/>
        <line x1="10" y1="45" x2="130" y2="45" stroke="#b45309" stroke-width="1.5"/>
        <line x1="10" y1="65" x2="130" y2="65" stroke="#b45309" stroke-width="1"/>
        <line x1="10" y1="85" x2="130" y2="85" stroke="#b45309" stroke-width="1"/>
        <line x1="10" y1="105" x2="130" y2="105" stroke="#b45309" stroke-width="1"/>
        <line x1="10" y1="125" x2="130" y2="125" stroke="#b45309" stroke-width="1"/>
        <line x1="45" y1="20" x2="45" y2="140" stroke="#b45309" stroke-width="1"/>
        <line x1="85" y1="20" x2="85" y2="140" stroke="#b45309" stroke-width="1"/>
        <!-- Seal/Stamp -->
        <circle cx="105" cy="155" r="12" fill="none" stroke="#dc2626" stroke-width="1.5"/>
        <circle cx="105" cy="155" r="9" fill="none" stroke="#dc2626" stroke-width="0.75" stroke-dasharray="2 1"/>
      </g>
    </g>
  </g>

  <!-- Left-to-Right Subtle Wash Overlay (Guarantees crisp readability of left-aligned text) -->
  <rect x="0" y="0" width="850" height="680" fill="url(#fadeLeft1)"/>

  <!-- Topographic Line Accents on Left Overlay -->
  <path d="M 0,100 Q 200,120 350,80 T 650,110" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.12"/>
  <path d="M 0,220 Q 220,240 380,190 T 700,230" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.12"/>
  <path d="M 0,350 Q 180,380 400,320 T 750,370" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.12"/>
  <path d="M 0,480 Q 250,510 450,460 T 800,500" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.12"/>
</svg>
