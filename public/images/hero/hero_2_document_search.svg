<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefcf8"/>
      <stop offset="40%" stop-color="#fdf8ed"/>
      <stop offset="100%" stop-color="#fbeed2"/>
    </linearGradient>

    <!-- Wood Desk Gradient -->
    <linearGradient id="wood2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Vintage Aged Paper -->
    <linearGradient id="paper2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="skin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf855e"/>
      <stop offset="100%" stop-color="#8c5332"/>
    </linearGradient>

    <linearGradient id="fadeLeft2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fefcf8" stop-opacity="0.96"/>
      <stop offset="40%" stop-color="#fefcf8" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#fefcf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fefcf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="680" fill="url(#bg2)"/>

  <!-- Desk Scene on the Right (X: 500 - 1600) -->
  <g transform="translate(520, 0)">
    <!-- Wooden Table Background -->
    <rect x="100" y="0" width="1000" height="680" fill="url(#wood2)"/>
    <!-- Wood Plank Lines -->
    <line x1="100" y1="120" x2="1100" y2="120" stroke="#451a03" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="280" x2="1100" y2="280" stroke="#451a03" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="440" x2="1100" y2="440" stroke="#451a03" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="590" x2="1100" y2="590" stroke="#451a03" stroke-width="2" opacity="0.4"/>

    <!-- Brass Lota / Traditional Vessel at Top Right -->
    <g transform="translate(720, 30)">
      <ellipse cx="60" cy="50" rx="45" ry="35" fill="#ca8a04"/>
      <ellipse cx="60" cy="30" rx="35" ry="15" fill="#eab308"/>
      <ellipse cx="60" cy="28" rx="28" ry="10" fill="#a16207"/>
      <!-- Metallic Highlights -->
      <path d="M 35,45 Q 60,35 85,45 Q 60,55 35,45 Z" fill="#fef08a" opacity="0.8"/>
    </g>

    <!-- Traditional Cloth / Saree Border at Far Right -->
    <g transform="translate(850, 0)">
      <polygon points="0,0 250,0 250,300 100,200" fill="#881337" opacity="0.85"/>
      <polygon points="0,0 250,0 250,80 50,40" fill="#f59e0b" opacity="0.9"/>
      <line x1="20" y1="20" x2="250" y2="200" stroke="#fde047" stroke-width="3" stroke-dasharray="8 4"/>
    </g>

    <!-- Central Paper Khatauni Document (Folded Authentic Revenue Record) -->
    <g transform="translate(260, 80) rotate(-6)">
      <!-- Drop Shadow -->
      <rect x="0" y="0" width="360" height="490" rx="8" fill="#000" opacity="0.25" transform="translate(10, 15)"/>
      <!-- Paper Body -->
      <rect x="0" y="0" width="360" height="490" rx="8" fill="url(#paper2)" stroke="#b45309" stroke-width="2"/>
      
      <!-- Vintage Revenue Table Header -->
      <rect x="25" y="45" width="310" height="24" rx="3" fill="#7c3aed" opacity="0.85"/>
      <line x1="25" y1="70" x2="335" y2="70" stroke="#92400e" stroke-width="2"/>

      <!-- Table Grid Lines (Column 1-12) -->
      <line x1="25" y1="105" x2="335" y2="105" stroke="#92400e" stroke-width="1"/>
      <line x1="25" y1="140" x2="335" y2="140" stroke="#92400e" stroke-width="1"/>
      <line x1="25" y1="175" x2="335" y2="175" stroke="#92400e" stroke-width="1"/>
      <line x1="25" y1="210" x2="335" y2="210" stroke="#92400e" stroke-width="1"/>
      <line x1="25" y1="245" x2="335" y2="245" stroke="#92400e" stroke-width="1"/>

      <!-- Vertical Column Dividers -->
      <line x1="85" y1="45" x2="85" y2="245" stroke="#92400e" stroke-width="1"/>
      <line x1="165" y1="45" x2="165" y2="245" stroke="#92400e" stroke-width="1"/>
      <line x1="245" y1="45" x2="245" y2="245" stroke="#92400e" stroke-width="1"/>

      <!-- Table Text Rows (Simulated Handwritten Script) -->
      <rect x="35" y="80" width="40" height="8" rx="2" fill="#78350f" opacity="0.6"/>
      <rect x="95" y="80" width="60" height="8" rx="2" fill="#78350f" opacity="0.7"/>
      <rect x="175" y="80" width="55" height="8" rx="2" fill="#78350f" opacity="0.6"/>
      <rect x="255" y="80" width="65" height="8" rx="2" fill="#78350f" opacity="0.6"/>

      <rect x="35" y="115" width="40" height="8" rx="2" fill="#78350f" opacity="0.6"/>
      <rect x="95" y="115" width="60" height="8" rx="2" fill="#78350f" opacity="0.7"/>
      <rect x="175" y="115" width="55" height="8" rx="2" fill="#78350f" opacity="0.6"/>
      <rect x="255" y="115" width="65" height="8" rx="2" fill="#78350f" opacity="0.6"/>

      <!-- Cadastral Plot Sketch at Bottom of Paper -->
      <g transform="translate(35, 270)">
        <rect x="0" y="0" width="290" height="180" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <!-- Multi-parcel Cadastral Polygon Map on Paper -->
        <polygon points="20,20 120,30 90,90 30,80" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
        <polygon points="120,30 220,15 200,85 90,90" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
        <polygon points="30,80 90,90 100,160 15,150" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
        <polygon points="90,90 200,85 260,140 180,165 100,160" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="145" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">452</text>
      </g>
    </g>

    <!-- Left Hand Holding Paper -->
    <g transform="translate(190, 260)">
      <path d="M 0,160 Q 60,100 110,60 L 130,90 Q 70,140 20,220 Z" fill="url(#skin2)"/>
      <ellipse cx="120" cy="70" rx="22" ry="14" fill="url(#skin2)" transform="rotate(-20 120 70)"/>
      <!-- Striped Kurta Sleeve -->
      <path d="M 0,160 L 40,240 L -20,280 L -50,200 Z" fill="#e0e7ff"/>
      <line x1="-30" y1="210" x2="20" y2="180" stroke="#818cf8" stroke-width="2"/>
      <line x1="-20" y1="230" x2="30" y2="200" stroke="#818cf8" stroke-width="2"/>
    </g>

    <!-- Right Hand Holding Modern Smartphone (Showing Bhoomi Sevak Digital App) -->
    <g transform="translate(620, 180)">
      <!-- Arm / Kurta Sleeve -->
      <path d="M 180,340 Q 140,260 90,200 L 130,170 Q 180,240 240,310 Z" fill="url(#skin2)"/>
      <ellipse cx="90" cy="180" rx="25" ry="18" fill="url(#skin2)"/>

      <!-- Smartphone Device -->
      <g transform="translate(-40, 0) rotate(8)">
        <!-- Phone Body -->
        <rect x="0" y="0" width="220" height="420" rx="32" fill="#0f172a" stroke="#334155" stroke-width="5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.4))"/>
        <!-- Screen Glass -->
        <rect x="10" y="15" width="200" height="390" rx="24" fill="#ffffff"/>

        <!-- App UI Top Header (Purple/Sky Civic Header) -->
        <rect x="10" y="15" width="200" height="45" rx="4" fill="#7c3aed"/>
        <line x1="25" y1="35" x2="65" y2="35" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="185" cy="35" r="8" fill="#ffffff" opacity="0.3"/>

        <!-- Interactive Map Preview on Phone -->
        <rect x="25" y="75" width="170" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <polygon points="40,95 110,85 100,145 35,135" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
        <polygon points="110,85 180,95 170,155 100,145" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
        <polygon points="35,135 100,145 95,205 30,195" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
        <polygon points="100,145 170,155 165,210 95,205" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
        <!-- Plot Number Badge -->
        <circle cx="130" cy="180" r="10" fill="#7c3aed"/>
        <text x="130" y="184" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">452</text>

        <!-- Structured Record Cards on Phone -->
        <g transform="translate(25, 240)">
          <rect x="0" y="0" width="170" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <circle cx="18" cy="18" r="8" fill="#7c3aed" opacity="0.15"/>
          <rect x="35" y="10" width="60" height="6" rx="2" fill="#334155"/>
          <rect x="35" y="20" width="110" height="6" rx="2" fill="#64748b"/>
        </g>
        <g transform="translate(25, 285)">
          <rect x="0" y="0" width="170" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <circle cx="18" cy="18" r="8" fill="#0284c7" opacity="0.15"/>
          <rect x="35" y="10" width="75" height="6" rx="2" fill="#334155"/>
          <rect x="35" y="20" width="90" height="6" rx="2" fill="#64748b"/>
        </g>
        <g transform="translate(25, 330)">
          <rect x="0" y="0" width="170" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <circle cx="18" cy="18" r="8" fill="#16a34a" opacity="0.15"/>
          <rect x="35" y="10" width="50" height="6" rx="2" fill="#334155"/>
          <rect x="35" y="20" width="105" height="6" rx="2" fill="#64748b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Left-to-Right Subtle Wash Overlay -->
  <rect x="0" y="0" width="850" height="680" fill="url(#fadeLeft2)"/>

  <!-- Topographic Contour Lines on Left Overlay -->
  <path d="M 0,90 Q 220,110 370,70 T 680,100" fill="none" stroke="#b45309" stroke-width="1" opacity="0.12"/>
  <path d="M 0,210 Q 240,230 400,180 T 730,220" fill="none" stroke="#b45309" stroke-width="1" opacity="0.12"/>
  <path d="M 0,340 Q 200,370 420,310 T 780,360" fill="none" stroke="#b45309" stroke-width="1" opacity="0.12"/>
  <path d="M 0,470 Q 270,500 470,450 T 830,490" fill="none" stroke="#b45309" stroke-width="1" opacity="0.12"/>
</svg>
